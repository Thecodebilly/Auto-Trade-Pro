<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AutoTrade Pro Admin</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #17212b;
      background: #edf2f5;
    }
    form {
      width: min(420px, calc(100% - 32px));
      background: #fff;
      border: 1px solid #d8e0e7;
      border-radius: 8px;
      padding: 28px;
      box-shadow: 0 18px 45px rgba(23, 33, 43, .12);
    }
    h1 { margin: 0 0 6px; font-size: 30px; letter-spacing: 0; }
    p { margin: 0 0 22px; color: #607080; }
    label { display: block; font-size: 13px; font-weight: 800; margin-bottom: 8px; color: #45525f; }
    input {
      width: 100%;
      min-height: 46px;
      border: 1px solid #d8e0e7;
      border-radius: 6px;
      padding: 12px 13px;
      font: inherit;
    }
    button {
      width: 100%;
      min-height: 46px;
      border: 0;
      border-radius: 6px;
      margin-top: 16px;
      background: #184E77;
      color: #fff;
      font: inherit;
      font-weight: 800;
      cursor: pointer;
    }
    .field { margin-top: 14px; }
    .help { margin: 7px 0 0; font-size: 12px; line-height: 1.4; color: #607080; }
    .error { margin-top: 14px; color: #9d2b2b; font-weight: 750; }
  </style>
</head>
<body>
  <form method="post">
    <h1>AutoTrade Pro</h1>
    <p>Dealer admin dashboard</p>
    <label for="password">Admin password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" autofocus>
    <div class="field">
      <label for="openai_api_key">OpenAI API key optional</label>
      <input id="openai_api_key" name="openai_api_key" type="password" autocomplete="off" placeholder="sk-...">
      <p class="help">Saved to the default dealer after a successful login. Leave blank to keep the current key.</p>
    </div>
    <button type="submit">Sign in</button>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
  </form>
</body>
</html>

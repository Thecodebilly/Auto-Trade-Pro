[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autotrade-pro"
version = "0.1.0"
description = "White-label trade-in valuation SaaS platform for automotive dealerships."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "Flask==2.3.2",
  "Werkzeug==2.3.8",
  "requests==2.32.5",
  "gunicorn==22.0.0",
  "psycopg[binary]>=3.2,<4",
]

[project.optional-dependencies]
dev = [
  "pytest==9.0.2",
  "playwright==1.57.0",
]

[project.scripts]
autotrade-pro = "autotrade_pro.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
autotrade_pro = ["templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
